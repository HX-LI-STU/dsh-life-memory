# Bundle patch layer for dsh-life-memory.
#
# The row loads this package's main entry (`lib/index.js`) as the host half
# (a plain Cordis plugin). The `dsh.client` declaration in package.json makes
# the web app load `lib/client.js` as the browser half (read-only memory panel).
#
# Per-plugin config lives under `config` (Cordis config keys; `!!js` expressions
# allowed). Everything is optional — defaults live in src/config.ts.
- insert:
    - id: dsh-life-memory
      name: dsh-life-memory
      config:
        # enabled: true
        # scope: global            # global | workspace
        # dataDir: ''              # default: <dsh-home>/life-memory
        # timezone:                # default: host local timezone
        # capture:
        #   userMessages: true
        #   assistantMessages: true
        #   toolCalls: true
        #   toolResults: true
        # embedding:
        #   provider: local        # local | openai-compatible
        #   dim: 512
        #   model: dsh-local-hash-v1
        #   baseURL: ''            # e.g. https://api.openai.com/v1
        #   apiKeyEnv: ''          # env var holding the API key
        # layers:
        #   enabled: [L1, L2, L3]
        #   autoConsolidate: true
        #   consolidationIntervalMs: 600000
        # recall:
        #   enabled: true
        #   injectSystemPrompt: true
        #   promptBudgetTokens: 800
        #   toolDefaultLimit: 8
        #   autoRecall: false       # 按当前用户输入自动检索（v1 默认关）
        #   maxCandidates: 200
        #   dedupSimilarity: 0.97
        #   mmr:
        #     enabled: true
